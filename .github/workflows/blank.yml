name: PC Virtual Linux

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Atualizar sistema
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Instalar ambiente gráfico
        run: |
          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            tigervnc-standalone-server \
            dbus-x11

      - name: Configurar desktop
        run: |
          mkdir -p ~/.vnc
          printf '#!/bin/sh\nunset SESSION_MANAGER\nunset DBUS_SESSION_BUS_ADDRESS\nexec dbus-launch --exit-with-session startxfce4\n' > ~/.vnc/xstartup
          chmod +x ~/.vnc/xstartup

      - name: Iniciar desktop
        run: |
          vncserver :1 \
            -localhost yes \
            -geometry 1280x720 \
            -depth 24
          sleep 5

      - name: Verificar sessão
        run: |
          vncserver -list
          echo "Desktop Linux iniciado."
          sleep infinity
